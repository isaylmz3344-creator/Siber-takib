<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Siber Güvenlik Paneli v5.0</title>
                <style>
                        body {
                                    background-color: #000;
                                                color: #0f0;
                                                            font-family: 'Courier New', Courier, monospace;
                                                                        display: flex;
                                                                                    justify-content: center;
                                                                                                align-items: center;
                                                                                                            min-height: 100vh;
                                                                                                                        margin: 0;
                                                                                                                                }
                                                                                                                                        .panel {
                                                                                                                                                    border: 2px solid #0f0;
                                                                                                                                                                box-shadow: 0 0 20px #0f0;
                                                                                                                                                                            border-radius: 10px;
                                                                                                                                                                                        padding: 20px;
                                                                                                                                                                                                    width: 90%;
                                                                                                                                                                                                                max-width: 400px;
                                                                                                                                                                                                                            background: rgba(0, 10, 0, 0.9);
                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                            h2 { text-align: center; text-shadow: 0 0 5px #0f0; }
                                                                                                                                                                                                                                                    p { font-size: 12px; text-align: center; color: #0a0; }
                                                                                                                                                                                                                                                            input[type="text"], input[type="password"] {
                                                                                                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                                                                                                                    padding: 10px;
                                                                                                                                                                                                                                                                                                margin: 10px 0;
                                                                                                                                                                                                                                                                                                            background: #000;
                                                                                                                                                                                                                                                                                                                        border: 1px solid #0f0;
                                                                                                                                                                                                                                                                                                                                    color: #0f0;
                                                                                                                                                                                                                                                                                                                                                box-sizing: border-box;
                                                                                                                                                                                                                                                                                                                                                            border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                            button {
                                                                                                                                                                                                                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                    padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                background: #000;
                                                                                                                                                                                                                                                                                                                                                                                                                            border: 1px solid #0f0;
                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #0f0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        text-shadow: 0 0 3px #0f0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        button:hover { background: #0f0; color: #000; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .log-ekrani {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-top: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border: 1px dashed #0f0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: #050505;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 11px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        min-height: 50px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    max-height: 150px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                overflow-y: auto;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            display: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="panel">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>🛰️ SİBER GÜVENLİK PANELİ</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>// Hile & Siber İstihbarat Veritabanı v5.0</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Siber raporları veya oyun hilelerini (GTA, Valorant, CS, PUBG, Brawl) aratın:</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="aramaKutusu" placeholder="Örn: valorant hile, gta mod, siber analiz...">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="veritabanindaAra()">VERİTABANINDA ARA</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="logEkrani" class="log-ekrani"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <hr style="border: 0; border-top: 1px solid #0f0; margin: 20px 0;">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h3>🔐 Yönetici Girişi</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="password" placeholder="Yönetici Şifresi">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="alert('Sistem Çevrimdışı!')">SİSTEME GİRİŞ YAP</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // İşte burası bizim sahte veritabanımız kanka! İçini istediğin gibi doldur.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const veritabanı = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "valorant hile": "🟢 BAŞARILI: Valorant Aimbot & Wallhack v2.4 aktif. User 1, User 2, User 3 sisteme bağlı.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "gta mod": "🟢 BAŞARILI: GTA 5 Para ve Dünyayı Değiştirme Mod Menüsü v1.0 bulundu.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "brawl hile": "🟢 BAŞARILI: Brawl Stars Sınırsız Taş Modu aktif. Sunucu stabil.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "siber analiz": "⚠️ UYARI: Hedef IP adresine yönelik siber istihbarat raporu sızdırıldı. Loglar inceleniyor.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "user 1": "👤 KULLANICI DETAYI: User 1 - Durum: Aktif | Yetki: VIP Üye | Son Giriş: Az Önce."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function veritabanindaAra() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const arananKelime = document.getElementById('aramaKutusu').value.toLowerCase().trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const logEkrani = document.getElementById('logEkrani');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(arananKelime === "") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alert("Lütfen arama kutusunu boş bırakmayın kanka!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    logEkrani.style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        logEkrani.innerHTML = "🔍 Veritabanı sorgulanıyor...<br>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Hacker efekti olsun diye 1 saniye gecikmeli açtırıyoruz
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(veritabanı[arananKelime]) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        logEkrani.innerHTML += veritabanı[arananKelime];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            logEkrani.innerHTML += "❌ HATA: '" + arananKelime + "' için veritabanında hiçbir kayıt veya hile bulunamadı!";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }, 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
