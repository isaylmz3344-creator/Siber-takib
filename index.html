<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Siber Takip Paneli</title>
                <style>
                        body {
                                    font-family: Arial, sans-serif;
                                                background-color: #121212;
                                                            color: #ffffff;
                                                                        padding: 20px;
                                                                                }
                                                                                        .container {
                                                                                                    max-width: 600px;
                                                                                                                margin: 0 auto;
                                                                                                                            text-align: center;
                                                                                                                                    }
                                                                                                                                            input {
                                                                                                                                                        padding: 10px;
                                                                                                                                                                    width: 70%;
                                                                                                                                                                                border: 1px solid #333;
                                                                                                                                                                                            background-color: #222;
                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                    border-radius: 4px;
                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                    button {
                                                                                                                                                                                                                                                padding: 10px 20px;
                                                                                                                                                                                                                                                            background-color: #007bff;
                                                                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                                                                border-radius: 4px;
                                                                                                                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                            button:hover {
                                                                                                                                                                                                                                                                                                                                        background-color: #0056b3;
                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                        .results {
                                                                                                                                                                                                                                                                                                                                                                    margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                text-align: left;
                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                .repo-card {
                                                                                                                                                                                                                                                                                                                                                                                                            background-color: #1e1e1e;
                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                    margin-bottom: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                border-radius: 4px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            border-left: 5px solid #007bff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            a {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #1e90ff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    text-decoration: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    a:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                text-decoration: underline;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h2>Siber Takip - İllegal Panel Avcısı</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>GitHub üzerinde arama yapmak için kelime yazın:</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="keywordInput" value="sorgu paneli">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="panelAra()">Ara</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="loading" style="display:none; margin-top:10px;">Aranıyor...</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="results" id="resultsContainer"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        async function panelAra() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const keyword = document.getElementById('keywordInput').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const resultsContainer = document.getElementById('resultsContainer');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const loading = document.getElementById('loading');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            resultsContainer.innerHTML = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                loading.style.display = 'block';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(keyword)}+in:name,description,readme`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const response = await fetch(url);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (response.ok) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const data = await response.json();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                loading.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (data.items.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        resultsContainer.innerHTML = '<p>Hiçbir sonuç bulunamadı.</p>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                resultsContainer.innerHTML = `<p><strong>Toplam ${data.total_count} potansiyel depo bulundu. İlk 5 sonuç:</strong></p>`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            data.items.slice(0, 5).forEach(repo => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const card = document.createElement('div');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            card.className = 'repo-card';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            card.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3>${repo.full_name}</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p><strong>Açıklama:</strong> ${repo.description || 'Açıklama yok.'}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <a href="${repo.html_url}" target="_blank">Depoya Git →</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        resultsContainer.appendChild(card);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        loading.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    resultsContainer.innerHTML = `<p style="color:red;">Hata oluştu! Kod: ${response.status}</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        loading.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                resultsContainer.innerHTML = `<p style="color:red;">Bağlantı hatası: ${error}</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
